stezkoy-ai-openreply:
  admin:
    settings:
      opencode_url_label: opencode server URL
      opencode_url_help: "Address of your headless opencode server. Start it with <code>opencode serve</code> (default port 4096)."
      opencode_username_label: opencode server username
      opencode_username_help: "Username for basic auth. Defaults to <code>opencode</code> if left empty."
      opencode_password_label: opencode server password
      opencode_password_help: "Optional. The value of <code>OPENCODE_SERVER_PASSWORD</code> if you started the server with basic auth enabled."
      opencode_agent_label: Agent (assistant behavior)
      opencode_agent_help: "Optional: the assistant's <i>persona/behavior</i> — <i>how</i> it acts. Examples: build (default, writes an answer right away), polite, jokester, writes in Russian, short & to-the-point. The behavior is defined by the agent's prompt in <code>opencode.json</code> (key <code>agent.prompt</code>), e.g. \"You are a friendly moderator. Answer in Russian.\" Leave empty to use the default agent. This is independent of the model."
      model_label: Model
      model_help: "Optional: <i>which AI engine</i> answers — this is separate from the agent. Examples: opencode/big-pickle, opencode/mimo-v2.5-free. The agent fixes <i>how</i> it behaves (behavior), the model fixes <i>which</i> AI answers. Leave on <em>— default —</em> to use the model already configured for the agent on the server. Only applied when a discussion session is first created."
      model_default_option: "— default —"
      model_custom_option: Set my own
      model_custom_help: "Enter your model as <code>provider/model</code> (e.g. <code>opencode/big-pickle</code>)."
      user_prompt_label: User assistant
      user_prompt_help: Enter the user id that will be used to generate AI responses.
      user_prompt_badge_label: User assistant badge
      user_prompt_badge_help: Text that will be displayed below the assistant user.
      enable_on_discussion_started_label: Enable on discussion start
      enable_on_discussion_started_help: When enabled, AI replies only at discussion start. When disabled, the discussion becomes a chat between the OP and the assistant; the assistant replies to every OP post.
      actions_label: Actions
      actions_help: "Check the connection to the opencode server, or close all active sessions to free memory."
      check_connection_label: Check connection
      close_all_sessions_label: Close all sessions
      connection_success: Connection successful. The opencode server is reachable.
      connection_success_with_model: "Connection successful. Model: {model}."
      connection_success_default_model: "Connection successful. No model set — the server default {model} will be used."
      connection_success_no_model: "Connection successful. No model set — the server default will be used."
      connection_fail: Connection failed. Make sure the server is running and credentials are correct.
      sessions_closed: "Extension sessions deleted. Other server sessions were not affected. Total sessions on the server: {total}."
      sessions_close_fail: Could not close sessions. Check the connection first.
      limits_label: Resource limits
      max_active_sessions_label: Max active sessions
      max_active_sessions_help: Maximum number of opencode sessions kept in memory simultaneously. Oldest sessions are closed first. Set to 0 to disable the limit.
      max_messages_per_session_label: Max messages per session
      max_messages_per_session_help: Maximum number of AI replies allowed per session before it is closed to free memory. Set to 0 to disable the limit.
      session_ttl_days_label: Session TTL (days)
      session_ttl_days_help: Sessions idle for longer than this many days are closed to free memory. Set to 0 to disable the TTL.
      enabled_tags_label: Tags
      enabled_tags_help: Select in which tags the assistant will generate responses.
      enabled_tags_empty: The flarum-tags extension must be enabled to choose tags.
    permissions:
      use_ai_assistant_label: Use AI assistant