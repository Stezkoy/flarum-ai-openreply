stezkoy-ai-openreply:
  admin:
    settings:
      opencode_url_label: opencode server URL
      opencode_url_help: "Address of your headless opencode server. Start it with <code>opencode serve</code> (default port 4096)."
      opencode_password_label: opencode server password
      opencode_password_help: "Optional. The value of <code>OPENCODE_SERVER_PASSWORD</code> if you started the server with basic auth enabled (username is <code>opencode</code>)."
      opencode_agent_label: Agent
      opencode_agent_help: "Optional: the opencode agent (assistant persona) to use. Leave empty to use the default agent. Advanced users can define custom agents in <code>opencode.json</code> (key <code>agent.prompt</code> is where the assistant's instructions live). Only applied when a discussion session is first created."
      model_label: Model
      model_help: "Optional: which model answers. Leave on <em>— default —</em> to use the model configured for the agent. Only applied when a discussion session is first created."
      model_default_option: "— default —"
      user_prompt_label: User assistant
      user_prompt_help: Enter the user id that will be used to generate AI responses.
      user_prompt_badge_label: User assistant badge
      user_prompt_badge_help: Text that will be displayed below the assistant user.
      enable_on_discussion_started_label: Enable on discussion start
      enable_on_discussion_started_help: When enabled, AI replies only at discussion start. When disabled, the discussion becomes a chat between the OP and the assistant; the assistant replies to every OP post.
      enabled_tags_label: Tags
      enabled_tags_help: Select in which tags the assistant will generate responses.
    permissions:
      use_ai_assistant_label: Use AI assistant