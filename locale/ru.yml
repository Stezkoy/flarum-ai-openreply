stezkoy-ai-openreply:
  admin:
    settings:
      opencode_url_label: URL opencode-сервера
      opencode_url_help: "Адрес вашего headless-сервера opencode. Запустите его командой <code>opencode serve</code> (порт по умолчанию 4096)."
      opencode_username_label: Логин opencode-сервера
      opencode_username_help: "Логин для basic-аутентификации. По умолчанию <code>opencode</code>, если оставить пустым."
      opencode_password_label: Пароль opencode-сервера
      opencode_password_help: "Необязательно. Значение <code>OPENCODE_SERVER_PASSWORD</code>, если вы запустили сервер с basic-аутентификацией."
      opencode_agent_label: Агент
      opencode_agent_help: "Необязательно: агент opencode (персона ассистента), который будет использоваться. Оставьте пустым, чтобы использовать агента по умолчанию. Продвинутые пользователи могут задать своих агентов в <code>opencode.json</code> (ключ <code>agent.prompt</code> — здесь живут инструкции для ассистента). Применяется при первом создании сессии обсуждения."
      model_label: Модель
      model_help: "Необязательно: какая модель будет отвечать. Оставьте <em>«— по умолчанию —»</em>, чтобы использовать модель, настроенную для агента. Применяется при первом создании сессии обсуждения."
      model_default_option: "— по умолчанию —"
      user_prompt_label: Пользователь-ассистент
      user_prompt_help: Укажите ID пользователя, от имени которого будут создаваться ответы.
      user_prompt_badge_label: Бейдж пользователя-ассистента
      user_prompt_badge_help: Текст, отображаемый под пользователем-ассистентом.
      enable_on_discussion_started_label: Отвечать при создании обсуждения
      enable_on_discussion_started_help: Если включено, ассистент отвечает только на первый пост обсуждения. Если выключено, обсуждение превращается в чат между автором и ассистентом — ассистент отвечает на каждое сообщение автора.
      actions_label: Действия
      actions_help: "Проверьте подключение к серверу opencode или закройте все активные сессии для освобождения памяти."
      check_connection_label: Проверить подключение
      close_all_sessions_label: Закрыть все сессии
      connection_success: Подключение успешно. Сервер opencode доступен.
      connection_fail: Не удалось подключиться. Убедитесь, что сервер запущен и данные для входа верны.
      sessions_closed: "Закрыто сессий: {count}."
      sessions_close_fail: Не удалось закрыть сессии. Сначала проверьте подключение.
      limits_label: Лимиты ресурсов
      max_active_sessions_label: Макс. число активных сессий
      max_active_sessions_help: Максимальное число сессий opencode, удерживаемых в памяти одновременно. Сначала закрываются самые старые. 0 — без ограничения.
      max_messages_per_session_label: Макс. сообщений на сессию
      max_messages_per_session_help: Максимальное число ответов AI на одну сессию, после чего она закрывается для освобождения памяти. 0 — без ограничения.
      session_ttl_days_label: TTL сессии (дней)
      session_ttl_days_help: Сессии, неактивные дольше этого числа дней, закрываются для освобождения памяти. 0 — без TTL.
      enabled_tags_label: Теги
      enabled_tags_help: Выберите теги, в которых ассистент будет генерировать ответы.
      enabled_tags_empty: Расширение flarum-tags должно быть включено, чтобы выбирать теги.
    permissions:
      use_ai_assistant_label: Использовать AI-ассистента